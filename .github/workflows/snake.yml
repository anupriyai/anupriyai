
name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate galaxy snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5C2E7&color_dots=#27213B,#49346B,#7955B1,#A783EA,#D8B4FE
            dist/github-snake-light.svg?palette=github-light&color_snake=#9D477F&color_dots=#F0EAF8,#D8C5F5,#B99BE8,#8962C4,#58358A
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
